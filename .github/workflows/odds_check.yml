name: Odds check (one-off)
on:
  push:
    branches: [odds-check]
    paths: ["probe/odds_check.py", ".github/workflows/odds_check.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python probe/odds_check.py | tee probe/odds_check.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "odds check data" && git push
