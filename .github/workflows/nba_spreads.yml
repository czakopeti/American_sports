name: NBA spreads
on:
  push:
    branches: [nba-spreads]
    paths: [".github/workflows/nba_spreads.yml", "scripts/nba_spreads.py"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/nba_spreads.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "NBA spreads" && git push
