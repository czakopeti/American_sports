name: Open prices (one-off)
on:
  push:
    branches: [open-prices]
    paths: ["probe/open_prices.py", ".github/workflows/open_prices.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python probe/open_prices.py | tee probe/open_prices.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "open prices data" && git push
